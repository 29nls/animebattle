# Dependabot — Anime VS Battle
#
# PR dependensi tetap melewati seluruh gerbang CI (termasuk npm audit
# high/critical dan build). Kelompokkan update agar review tidak dibanjiri PR
# kecil; jangan menambahkan auto-merge sebelum branch protection aktif.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
