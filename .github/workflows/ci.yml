# CI — Anime VS Battle
#
# Gerbang verifikasi pada setiap push dan pull request:
#   - 9 gerbang PGlite/unit/arsitektur/build (job `verify`)
#   - npm audit high/critical sebagai gerbang (job `verify`)
#   - migrasi dari nol + drift docs/schema.sql + RLS JWT + REFRESH CONCURRENTLY
#     pada service container PostgreSQL 16 (job `database`)
#   - uji restore pg_dump/pg_restore ke database terpisah (job `backup-restore`)
#
# Angka yang diharapkan tiap gerbang ada di README.md ("Verifikasi") dan
# docs/CONTRIBUTING.md; angka itu diperbarui hanya dari hasil run nyata.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verifikasi lengkap (9 gerbang + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependensi (npm ci)
        run: npm ci

      # ── Gerbang audit environment publik ───────────────────────────────
      # Nama saja; tidak membaca/mencetak nilai. Gagal bila ada NEXT_PUBLIC_*
      # baru yang belum ditinjau atau berkas .env nyata ter-commit.
      - name: Gerbang 0b · Audit environment publik
        run: npm run audit:env

      # ── Gerbang audit: high/critical harus nol ───────────────────────────
      - name: Gerbang 0 · Audit dependensi (high/critical)
        run: npm audit --audit-level=high

      # ── Gerbang 1: typecheck ────────────────────────────────────────────
      - name: Gerbang 1 · Typecheck
        run: npm run typecheck

      # ── Gerbang 2: lint batas arsitektur ───────────────────────────────
      - name: Gerbang 2 · Lint batas arsitektur
        run: npm run lint

      # ── Gerbang 3: schema + seed di Postgres WASM ──────────────────────
      - name: Gerbang 3 · Schema (59 uji)
        run: npm run validate:schema

      # ── Gerbang 4: case library AC-31..34 ──────────────────────────────
      - name: Gerbang 4 · Battle cases (425 pemeriksaan)
        run: npm run validate:battle-cases

      # ── Gerbang 5: mutasi guard AC-36 ─────────────────────────────────
      - name: Gerbang 5 · Battle guards
        run: npm run check:battle-guards

      # ── Gerbang 6: invarian arsitektur ────────────────────────────────
      - name: Gerbang 6 · Architecture (38 pemeriksaan)
        run: npm run check:architecture

      # ── Gerbang 7+8: unit engine/security/web/ingestion/db + aturan ──
      - name: Gerbang 7+8 · Unit test (engine, security, web, ingestion, db, lint, lighthouse)
        run: npm test

      # ── Gerbang 9: build produksi ─────────────────────────────────────
      - name: Gerbang 9 · Build produksi (next build)
        run: npm run build

  database:
    name: Migrasi + drift + Postgres nyata (RLS JWT, MV CONCURRENTLY)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: animebattle
          POSTGRES_PASSWORD: animebattle_ci
          POSTGRES_DB: animebattle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animebattle -d animebattle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://animebattle:animebattle_ci@localhost:5432/animebattle_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependensi (npm ci)
        run: npm ci

      # Dari database kosong: 0001 → 0002, dicatat di schema_migrations.
      - name: Terapkan semua migrasi dari nol
        run: npm run migrate

      # Baseline PGlite (docs/schema.sql) vs database hasil migrasi.
      - name: Drift docs/schema.sql vs database hasil migrasi
        run: npm run check:schema-drift

      # RLS berbasis request.jwt.claims + REFRESH ... CONCURRENTLY.
      - name: Verifikasi RLS JWT + REFRESH CONCURRENTLY
        run: npm run verify:postgres

  backup-restore:
    name: Uji restore pg_dump/pg_restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: animebattle
          POSTGRES_PASSWORD: animebattle_ci
          POSTGRES_DB: animebattle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animebattle -d animebattle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://animebattle:animebattle_ci@localhost:5432/animebattle_ci
      SOURCE_DATABASE_URL: postgres://animebattle:animebattle_ci@localhost:5432/animebattle_ci
      RESTORE_DATABASE_URL: postgres://animebattle:animebattle_ci@localhost:5432/animebattle_restore
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependensi (npm ci)
        run: npm ci

      - name: Migrasi + seed database sumber
        run: |
          npm run migrate
          npm run seed:db

      - name: Buat database tujuan restore
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create database animebattle_restore'

      # Klien pg_dump/pg_restore harus semayor dengan server. Runner
      # `ubuntu-latest` dapat membawa klien 17/18 yang menulis
      # `SET transaction_timeout`, setting yang tidak dikenal server 16.
      - name: Dump logis (klien PostgreSQL 16)
        run: |
          docker run --rm --network host -v /tmp:/tmp postgres:16 \
            pg_dump "$DATABASE_URL" \
              --format=custom --no-owner --no-acl \
              --file=/tmp/animebattle.dump
          ls -lh /tmp/animebattle.dump

      - name: Restore ke database terpisah (klien PostgreSQL 16)
        run: |
          docker run --rm --network host -v /tmp:/tmp postgres:16 \
            pg_restore --no-owner --no-acl --dbname="$RESTORE_DATABASE_URL" /tmp/animebattle.dump

      # Membandingkan migrasi, relasi, jumlah baris, fungsi, dan policy.
      - name: Verifikasi restore identik dengan sumber
        run: npm run verify:restore

  secret-scan:
    name: Pemindaian secret (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (riwayat penuh)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
